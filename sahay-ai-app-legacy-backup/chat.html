<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SAHAY-AI Check-in Chat – Talk to SAHAY about how you are feeling." />
  <title>Check-in Chat – SAHAY-AI</title>
  <script src="assets/tailwind.min.js"></script>


  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Public+Sans:wght@600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script id="tw-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: { "primary": "#006b5f", "on-primary": "#ffffff", "primary-container": "#14b8a6", "on-primary-container": "#00423b", "primary-fixed": "#71f8e4", "primary-fixed-dim": "#4fdbc8", "secondary": "#515f74", "on-secondary": "#ffffff", "secondary-container": "#d5e3fc", "on-secondary-container": "#57657a", "error": "#ba1a1a", "on-error": "#ffffff", "error-container": "#ffdad6", "on-error-container": "#93000a", "background": "#f8f9fa", "on-background": "#191c1d", "surface": "#f8f9fa", "on-surface": "#191c1d", "surface-variant": "#e1e3e4", "on-surface-variant": "#3c4947", "surface-container-lowest": "#ffffff", "surface-container-low": "#f3f4f5", "surface-container": "#edeeef", "surface-container-high": "#e7e8e9", "surface-container-highest": "#e1e3e4", "outline": "#6c7a77", "outline-variant": "#bbcac6", "surface-tint": "#006b5f", "inverse-surface": "#2e3132", "inverse-on-surface": "#f0f1f2" },
          borderRadius: { "DEFAULT": "0.5rem", "sm": "0.25rem", "md": "0.75rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
          spacing: { "base": "4px", "xs": "8px", "sm": "12px", "md": "16px", "lg": "24px", "xl": "32px", "touch-target": "48px", "container-margin": "16px" },
          fontFamily: { "display": ["Public Sans", "sans-serif"], "headline": ["Public Sans", "sans-serif"], "body": ["Inter", "sans-serif"], "label": ["Inter", "sans-serif"] },
          fontSize: { "display-lg": ["32px", { lineHeight: "40px", fontWeight: "700", letterSpacing: "-0.02em" }], "headline-lg": ["24px", { lineHeight: "32px", fontWeight: "600" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }], "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600", letterSpacing: "0.01em" }], "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }] }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .icon-fill {
      font-variation-settings: 'FILL' 1;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }

    html,
    body {
      height: 100%;
    }

    .bubble-ai {
      background: #ffffff;
      border: 1px solid #edeeef;
      border-radius: 1.25rem;
      border-top-left-radius: 0.25rem;
    }

    .bubble-user {
      background: #006b5f;
      color: #ffffff;
      border-radius: 1.25rem;
      border-top-right-radius: 0.25rem;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }

    .typing-dot {
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-animate {
      animation: slideInUp 0.25s ease forwards;
    }

    .lang-chip {
      transition: background 0.15s;
      cursor: pointer;
    }

    .lang-chip.active {
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      color: #191c1d;
      font-weight: 600;
    }

    .nav-item {
      transition: background-color 0.15s, transform 0.1s;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .progress-bar {
      background: #e7e8e9;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      background: #14b8a6;
      transition: width 0.5s ease;
    }
  </style>
</head>

<body class="bg-background text-on-background flex flex-col h-full">
  <header
    class="fixed top-0 w-full bg-surface z-50 flex items-center justify-between px-md border-b border-outline-variant"
    style="height:56px;">
    <div class="flex items-center gap-sm">
      <button
        class="w-touch-target h-touch-target flex items-center justify-center text-primary hover:bg-surface-container-low rounded-full transition-colors"
        onclick="window.location.href='home.html'" aria-label="Back to home">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <span class="font-headline text-headline-lg font-bold text-primary" data-i18n="brand_name">SAHAY-AI</span>
    </div>
    <div class="flex items-center gap-sm">
      <button id="btn-exit-safely"
        class="px-sm py-2 bg-error text-on-error font-label text-label-lg rounded-full flex items-center gap-base shadow-sm active:scale-95 transition-transform"
        onclick="confirmExit()">
        <span class="material-symbols-outlined" style="font-size:16px;">exit_to_app</span>
        <span data-i18n="exit_safely">Exit Safely</span>
      </button>
    </div>
  </header>

  <!-- Progress Indicator -->
  <div class="fixed top-[56px] w-full z-40 px-md py-1 bg-surface border-b border-outline-variant">
    <div class="flex items-center justify-between mb-1">
      <span id="progress-label" class="font-label text-label-sm text-on-surface-variant"
        data-i18n="progress_label">Check-in progress</span>
      <span id="progress-pct" class="font-label text-label-sm text-on-surface-variant font-medium">Step 1 of 5</span>
    </div>
    <div class="progress-bar h-1 w-full">
      <div id="progress-fill" class="progress-fill h-full" style="width:20%"></div>
    </div>
  </div>

  <!-- Language Toggle (6 Supported Languages) -->
  <div class="fixed z-30 w-full flex justify-center px-container-margin" style="top:98px;">
    <div
      class="flex bg-surface-container-low rounded-full p-1 overflow-x-auto max-w-full gap-1 shadow-sm border border-outline-variant">
      <button id="chip-en"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface whitespace-nowrap"
        onclick="switchLang('en')">English</button>
      <button id="chip-ta"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface-variant whitespace-nowrap"
        onclick="switchLang('ta')">தமிழ்</button>
      <button id="chip-hi"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface-variant whitespace-nowrap"
        onclick="switchLang('hi')">हिन्दी</button>
      <button id="chip-te"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface-variant whitespace-nowrap"
        onclick="switchLang('te')">తెలుగు</button>
      <button id="chip-kn"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface-variant whitespace-nowrap"
        onclick="switchLang('kn')">ಕನ್ನಡ</button>
      <button id="chip-ml"
        class="lang-chip px-3 py-1.5 rounded-full font-label text-label-sm text-on-surface-variant whitespace-nowrap"
        onclick="switchLang('ml')">മലയാളം</button>
    </div>
  </div>

  <!-- Title row -->
  <div class="fixed z-20 w-full text-center" style="top:144px;">
    <h2 class="font-headline text-headline-md text-on-surface" data-i18n="chat_title">Check-in with SAHAY</h2>
    <p class="font-label text-label-sm text-on-surface-variant flex items-center justify-center gap-1 mt-0.5"
      data-i18n="chat_subtitle">
      Adaptive check-in – takes about 5 minutes
    </p>
  </div>

  <!-- Chat Messages Area -->
  <main id="chat-area" class="flex-1 overflow-y-auto px-container-margin flex flex-col gap-sm"
    style="padding-top:196px; padding-bottom:140px;">
    <!-- Messages injected by JS -->
  </main>

  <!-- Quick Reply Chips -->
  <div id="quick-replies" class="fixed z-40 w-full px-container-margin flex flex-wrap gap-xs justify-center"
    style="bottom:88px;">
    <!-- injected by JS -->
  </div>

  <!-- Bottom Input Area -->
  <div
    class="fixed z-50 bottom-[72px] w-full bg-surface px-container-margin py-sm border-t border-surface-container-low">
    <div
      class="flex items-center gap-sm bg-surface-container-lowest rounded-full p-1 border border-outline-variant focus-within:border-primary focus-within:border-2 transition-all shadow-sm">
      <button
        class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors shrink-0"
        onclick="toggleAttach()" aria-label="Attach">
        <span class="material-symbols-outlined">add_circle</span>
      </button>
      <input id="chat-input"
        class="flex-1 bg-transparent border-none focus:ring-0 font-body text-body-md text-on-surface placeholder:text-on-surface-variant px-2"
        style="height:48px;" placeholder="Type a message..." data-i18n-placeholder="type_message_placeholder"
        type="text" autocomplete="off" />
      <button id="send-btn"
        class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0 shadow-sm active:scale-95 transition-transform mr-1"
        onclick="sendMessage()" aria-label="Send">
        <span class="material-symbols-outlined">send</span>
      </button>
      <button id="mic-btn"
        class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0 hover:bg-surface-container-high transition-colors mr-1"
        onclick="toggleMic()" aria-label="Voice input">
        <span class="material-symbols-outlined">mic</span>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav
    class="fixed bottom-0 left-0 w-full bg-surface-container-lowest shadow-lg border-t border-outline-variant z-50 flex justify-around items-center px-container-margin py-xs"
    style="height:72px;">
    <button id="nav-home"
      class="nav-item flex flex-col items-center justify-center rounded-xl px-3 py-1 text-on-surface-variant"
      onclick="window.location.href='home.html'" aria-label="Home">
      <span class="material-symbols-outlined nav-icon" style="font-size:22px;">home</span>
      <span class="font-label text-label-sm mt-0.5" data-i18n="nav_home">Home</span>
    </button>
    <button id="nav-chat"
      class="nav-item flex flex-col items-center justify-center rounded-xl px-3 py-1 bg-primary-container text-on-primary-container"
      aria-label="Chat" aria-current="page">
      <span class="material-symbols-outlined nav-icon icon-fill" style="font-size:22px;">chat_bubble</span>
      <span class="font-label text-label-sm mt-0.5" data-i18n="nav_chat">Chat</span>
    </button>
    <button id="nav-journey"
      class="nav-item flex flex-col items-center justify-center rounded-xl px-3 py-1 text-on-surface-variant"
      onclick="window.location.href='journey.html'" aria-label="Journey">
      <span class="material-symbols-outlined nav-icon" style="font-size:22px;">auto_graph</span>
      <span class="font-label text-label-sm mt-0.5" data-i18n="nav_journey">Journey</span>
    </button>
    <button id="nav-support"
      class="nav-item flex flex-col items-center justify-center rounded-xl px-3 py-1 text-on-surface-variant"
      onclick="window.location.href='support.html'" aria-label="Support">
      <span class="material-symbols-outlined nav-icon" style="font-size:22px;">contact_support</span>
      <span class="font-label text-label-sm mt-0.5" data-i18n="nav_support">Support</span>
    </button>
    <button id="nav-profile"
      class="nav-item flex flex-col items-center justify-center rounded-xl px-3 py-1 text-on-surface-variant"
      onclick="window.location.href='profile.html'" aria-label="Profile">
      <span class="material-symbols-outlined nav-icon" style="font-size:22px;">person</span>
      <span class="font-label text-label-sm mt-0.5" data-i18n="nav_profile">Profile</span>
    </button>
  </nav>

  <!-- Exit Confirmation Dialog -->
  <div id="exit-dialog" class="hidden fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-md"
    role="dialog" aria-modal="true">
    <div class="bg-surface-container-lowest rounded-2xl p-xl w-full max-w-sm shadow-xl">
      <h2 class="font-headline text-headline-md text-on-surface mb-sm" data-i18n="exit_safely_dialog_title">Exit Safely?
      </h2>
      <p class="font-body text-body-md text-on-surface-variant mb-lg" data-i18n="exit_safely_dialog_desc">This will
        immediately redirect to Google to help conceal your browsing activity.</p>
      <div class="flex flex-col gap-sm">
        <button class="w-full bg-error text-on-error font-label text-label-lg h-touch-target rounded-full"
          onclick="SAHAY.safeExit()" data-i18n="exit_now_google">Exit Now – Go to Google</button>
        <button
          class="w-full bg-surface-container-low text-on-surface font-label text-label-lg h-touch-target rounded-full"
          onclick="document.getElementById('exit-dialog').classList.add('hidden')" data-i18n="stay_here">Stay
          Here</button>
      </div>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="env.js"></script>
  <script src="shared.js"></script>
  <script>
    let currentTurn = 0;
    const MAX_TURNS = 5;
    const chatArea = document.getElementById('chat-area');
    const chatInput = document.getElementById('chat-input');
    const quickRepliesDiv = document.getElementById('quick-replies');
    const progressFill = document.getElementById('progress-fill');
    const progressPct = document.getElementById('progress-pct');
    let isBotTyping = false;

    // Store chat history
    let chatLog = [];

    function updateChipState() {
      const currentLang = SAHAY.state.language || 'en';
      document.querySelectorAll('.lang-chip').forEach(c => {
        c.classList.remove('active');
        c.classList.add('text-on-surface-variant');
      });
      const activeChip = document.getElementById('chip-' + currentLang);
      if (activeChip) {
        activeChip.classList.add('active');
        activeChip.classList.remove('text-on-surface-variant');
      }
    }

    function switchLang(lang) {
      SAHAY.setLanguage(lang);
      updateChipState();
      updateProgressText();
    }

    function createAIBubble(text) {
      return `
        <div class="flex gap-sm max-w-[85%] self-start msg-animate">
          <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 mt-1">
            <span class="material-symbols-outlined" style="font-size:18px;">smart_toy</span>
          </div>
          <div class="bubble-ai p-md font-body text-body-md text-on-surface shadow-sm">${text}</div>
        </div>`;
    }

    function createUserBubble(text) {
      return `
        <div class="flex gap-sm max-w-[85%] self-end flex-row-reverse msg-animate">
          <div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0 mt-1">
            <span class="material-symbols-outlined" style="font-size:18px;">person</span>
          </div>
          <div class="bubble-user p-md font-body text-body-md shadow-sm">${text}</div>
        </div>`;
    }

    function createTypingIndicator() {
      const el = document.createElement('div');
      el.id = 'typing-indicator';
      el.className = 'flex gap-sm max-w-[85%] self-start msg-animate';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 mt-1">
          <span class="material-symbols-outlined" style="font-size:18px;">smart_toy</span>
        </div>
        <div class="bg-surface-container-lowest border border-surface-container rounded-2xl rounded-tl-sm px-md py-sm flex items-center gap-1 shadow-sm">
          <div class="typing-dot w-2 h-2 rounded-full bg-on-surface-variant"></div>
          <div class="typing-dot w-2 h-2 rounded-full bg-on-surface-variant"></div>
          <div class="typing-dot w-2 h-2 rounded-full bg-on-surface-variant"></div>
        </div>`;
      return el;
    }

    function scrollBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function updateProgressText() {
      const step = Math.min(currentTurn + 1, MAX_TURNS);
      const total = MAX_TURNS;
      const pct = Math.round((step / total) * 100);
      progressFill.style.width = pct + '%';
      if (currentTurn >= MAX_TURNS) {
        progressPct.innerHTML = `<button class="text-primary font-bold hover:underline" onclick="finishCheckin()">${SAHAY.t('finish_checkin') || 'Finish Check-in'}</button>`;
      } else {
        progressPct.textContent = SAHAY.t('step_x_of_y', { x: step, y: total });
      }
    }

    async function showBotMessage(userMsg = "") {
      isBotTyping = true;
      chatInput.disabled = true;
      document.getElementById('send-btn').disabled = true;
      quickRepliesDiv.innerHTML = '';

      const typing = createTypingIndicator();
      chatArea.appendChild(typing);
      scrollBottom();

      try {
        const text = await SAHAY.getAIResponse(chatLog, userMsg);
        typing.remove();
        chatLog.push({ role: 'ai', text: text });
        chatArea.insertAdjacentHTML('beforeend', createAIBubble(text));
      } catch (err) {
        typing.remove();
        console.error("AI Response error", err);
        const text = SAHAY.t('error_ai_response') || "I am having trouble connecting right now. Please try again.";
        chatLog.push({ role: 'ai', text: text });
        chatArea.insertAdjacentHTML('beforeend', createAIBubble(text));
      } finally {
        isBotTyping = false;
        chatInput.disabled = false;
        document.getElementById('send-btn').disabled = false;

        if (currentTurn >= MAX_TURNS) {
          showFinishOptions();
        } else {
          chatInput.focus();
        }
        scrollBottom();
      }
    }

    function showFinishOptions() {
      quickRepliesDiv.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'bg-primary text-on-primary font-label text-label-lg px-lg py-sm rounded-full shadow-md active:scale-95 transition-transform';
      btn.innerHTML = `<span class="flex items-center gap-2">${SAHAY.t('finish_checkin') || 'Finish Check-in'} <span class="material-symbols-outlined">send</span></span>`;
      btn.onclick = finishCheckin;
      quickRepliesDiv.appendChild(btn);
      scrollBottom();
    }

    function finishCheckin() {
      // Send to backend/localStorage analysis
      try {
        const data = SAHAY.processCheckin(chatLog, 'chat');
        sessionStorage.setItem('currentAnalysis', JSON.stringify(data));
        window.location.href = 'result.html';
      } catch (err) {
        console.error(err);
        window.location.href = 'result.html';
      }
    }

    function sendUserMessage(text) {
      if (!text.trim() || isBotTyping) return;
      chatLog.push({ role: 'user', text: text });
      chatArea.insertAdjacentHTML('beforeend', createUserBubble(text));
      chatInput.value = '';
      quickRepliesDiv.innerHTML = '';
      scrollBottom();

      currentTurn++;
      updateProgressText();
      showBotMessage(text);
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (text) sendUserMessage(text);
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function toggleMic() {
      const btn = document.getElementById('mic-btn');
      btn.classList.toggle('bg-error');
      btn.classList.toggle('text-on-error');
    }

    function toggleAttach() { }

    function confirmExit() {
      document.getElementById('exit-dialog').classList.remove('hidden');
    }

    window.addEventListener('load', () => {
      updateChipState();
      updateProgressText();
      showBotMessage();
    });

    window.addEventListener('sahay-language-changed', () => {
      updateChipState();
      updateProgressText();
    });
  </script>
</body>

</html>
